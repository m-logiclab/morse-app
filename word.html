    let quizOrder = [];
    let currentIndex = 0;
    let correctCount = 0;
    let currentCode = '';

    function replayMorse() {
      if (currentCode) playMorse(currentCode);
    }

    function playTone(duration) {
      const oscillator = context.createOscillator();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(frequency, context.currentTime);
      oscillator.connect(context.destination);
      oscillator.start();
      oscillator.stop(context.currentTime + duration / 1000);
    }

    async function playMorse(code) {
      const letters = code.split(' ');
      for (const letter of letters) {
        for (const symbol of letter) {
          if (symbol === '.') {
            playTone(unitTime);
            await sleep(unitTime);
          } else if (symbol === '-') {
            playTone(unitTime * 3);
            await sleep(unitTime * 3);
          }
          await sleep(unitTime);
        }
        await sleep(unitTime * 3);
      }
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function wordToMorse(word) {
      return word.split('').map(char => morseMap[char]).join(' ');
    }

    function startGame() {
      quizOrder = shuffle([...wordList]).slice(0, totalQuestions);
      currentIndex = 0;
      correctCount = 0;
      document.getElementById('score').textContent = '';
      document.getElementById('result').textContent = '';
      document.getElementById('startBtn').textContent = '🔄 はじめから';
      document.getElementById('replayBtn').style.display = 'inline-block';
      document.querySelector('.level-card').style.display = 'block';
      nextQuestion();
    }

    function nextQuestion() {
      if (currentIndex >= quizOrder.length) {
        document.getElementById('question').textContent = '🎉 終了！おつかれさま！';
        document.getElementById('choices').innerHTML = '';
        document.getElementById('score').textContent = `正解数：${correctCount} / ${quizOrder.length}`;
        document.getElementById('replayBtn').disabled = true;
        document.getElementById('replayBtn').style.display = 'none';
        document.getElementById('winModal').style.display = 'flex';
        return;
      }

      const word = quizOrder[currentIndex];
      const code = wordToMorse(word);
      currentCode = code;
      playMorse(code);
      document.getElementById('replayBtn').disabled = false;

      document.getElementById('question').textContent =
        `問題 ${currentIndex + 1}： ${code
          .split(' ')
          .map(c => c.replace(/\./g, '・').replace(/-/g, '－'))
          .join('　')}`;

      showChoices(word);
    }

    function showChoices(correct) {
      const shuffled = shuffle([...quizOrder]);
      const container = document.getElementById('choices');
      container.innerHTML = '';
      shuffled.forEach(word => {
        const btn = document.createElement('button');
        btn.textContent = word;

        btn.onclick = () => {
          const result = document.getElementById('result');

          // ✅ 表示スペースを確保しつつ、表示する！
          result.style.visibility = 'visible';

          if (word === correct) {
            result.textContent = '⭕ 正解！';
            correctCount++;
          } else {
            result.textContent = `❌ 不正解… 正解は ${correct} でした`;
          }

          currentIndex++;

          setTimeout(() => {
            // ✅ 表示は消すけどスペースは残す！
            result.style.visibility = 'hidden';
            result.textContent = '';
            nextQuestion();
          }, 1000);
        };

        container.appendChild(btn);
      });
    }

    function toggleHint() {
      const hint = document.getElementById('hintImage');
      const isHidden = window.getComputedStyle(hint).display === 'none';
      hint.style.display = isHidden ? 'block' : 'none';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const level = urlParams.get('level') || 'level1';
    // ✅ 表示用に数字だけ抜き出す（例：level2 → 2）
    const levelNum = level.replace('level', '');

    const modalContent = document.querySelector('.modal-content');

    const quizButton = document.createElement('button');

    quizButton.onclick = () => {

    };
    modalContent.appendChild(letterButton);

    const fullMap = levelData[level]?.morseMap || levelData['level1'].morseMap;
    const morseMap = Object.keys(fullMap).length > 6 ? getRandomSubset(fullMap, 6) : fullMap;

    // ✅ morseMap をレベルに応じて切り替え
    //const morseMap = levelData[level]?.morseMap || levelData['level1'].morseMap;

    // ✅ タイトルもレベル表示に変更（任意）
    document.querySelector('h1').textContent = `🃏 モールスかるた：レベル${levelNum}`;

    const context = new (window.AudioContext || window.webkitAudioContext)();
    const frequency = 600;
    const unitTime = 100;

    function playTone(duration) {
      const oscillator = context.createOscillator();
      const gainNode = context.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(frequency, context.currentTime);
      oscillator.connect(gainNode);
      gainNode.connect(context.destination);
      gainNode.gain.setValueAtTime(0.5, context.currentTime); // ← 音量調整
      oscillator.start();
      oscillator.stop(context.currentTime + duration / 1000);
    }

    async function playMorse(code) {
      for (const symbol of code) {
        if (symbol === '.') {
          playTone(unitTime);
          await sleep(unitTime);
        } else if (symbol === '-') {
          playTone(unitTime * 3);
          await sleep(unitTime * 3);
        }
        await sleep(unitTime);
      }
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    const shuffledLetters = Object.keys(morseMap).sort(() => Math.random() - 0.5);
    const shuffledCodes = Object.values(morseMap).sort(() => Math.random() - 0.5);

    const leftColumn = document.getElementById('leftColumn');
    const rightColumn = document.getElementById('rightColumn');
    let selected = [];

    shuffledLetters.forEach(letter => {
      const btn = document.createElement('button');
      btn.textContent = letter;
      btn.dataset.type = 'letter';
      btn.dataset.value = letter;

// ✅ ここに追加！
btn.classList.add('game-button');

      btn.addEventListener('click', async () => {
        await context.resume();
        handleClick(btn);
        //playMorse(morseMap[letter]); 文字ボタンでは音を鳴らさない
      });

      leftColumn.appendChild(btn);
    });

    shuffledCodes.forEach(code => {
      const btn = document.createElement('button');
      //btn.textContent = code;
      btn.textContent = readableMorse(code); // ← これで見やすく！
      btn.dataset.type = 'morse';
      btn.dataset.value = code;

// ✅ ここに追加！
btn.classList.add('game-button');

      btn.addEventListener('click', async () => {
        await context.resume();
        handleClick(btn);
        playMorse(code);
      });

      rightColumn.appendChild(btn);
    });

    function handleClick(btn) {
      if (btn.disabled || selected.length === 2 || selected.includes(btn)) return;

      btn.classList.add('selected');
      selected.push(btn);

      if (selected.length === 2) {
        const [a, b] = selected;
        const match =
          a.dataset.type !== b.dataset.type &&
          morseMap[a.dataset.type === 'letter' ? a.dataset.value : b.dataset.value] ===
          (a.dataset.type === 'morse' ? a.dataset.value : b.dataset.value);

        setTimeout(() => {
          if (match) {
            a.disabled = true;
            b.disabled = true;
            a.classList.remove('selected');
            b.classList.remove('selected');
            console.log('✅ Correct!');
          } else {
            a.classList.remove('selected');
            b.classList.remove('selected');
            console.log('❌ Wrong!');
          }
          selected = [];

          //const allDisabled = [...document.querySelectorAll('button')].every(btn => btn.disabled);
const allDisabled = [...document.querySelectorAll('.game-button')].every(btn => btn.disabled);

if (allDisabled) {
  setTimeout(() => {
    document.getElementById('winModal').style.display = 'flex';
  }, 200);
}
        }, 500);
      }

function readableMorse(code) {
  return code.replace(/\./g, '・').replace(/-/g, '－');
}

//morseMap をシャッフルして6個に絞る
function getRandomSubset(map, count = 6) {
  const entries = Object.entries(map);
  const shuffled = entries.sort(() => Math.random() - 0.5);
  const subset = shuffled.slice(0, count);
  return Object.fromEntries(subset);
}
